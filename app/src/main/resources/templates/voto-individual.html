<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votar - FNE</title>
       <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/voto-individual.css}">
</head>
<body>
    <!-- Se incluye la barra de navegación -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-votacion">
        <br>
        <br>
        <br>
        <h1 class="main-title" th:text="'Votando por ' + ${candidata.nombres} + ' ' + ${candidata.apellidos}">Votando por...</h1>
        <p class="subtitle" th:text="${candidata.colegioSecundario}">Colegio...</p>

        <div class="voto-card">
            <img th:src="@{'/img/candidatas/' + ${candidata.id} + '.webp'}" alt="Foto de la candidata" class="candidata-photo-large">
            
            <!-- El formulario ahora envía 3 puntajes -->
            <form id="voting-form" th:action="@{/votar/enviar}" method="post" class="voto-form">
                <input type="hidden" name="candidataId" th:value="${candidata.id}" />

                <!-- Campo para el Puntaje 1 -->
                <div class="form-group">
                    <label for="puntaje1">Puntaje 1 (Ej: Elegancia)</label>
                    <input type="number" id="puntaje1" name="puntaje1" class="form-control" min="1" max="10" step="0.5" required>
                </div>

                <!-- Campo para el Puntaje 2 -->
                <div class="form-group">
                    <label for="puntaje2">Puntaje 2 (Ej: Desplante)</label>
                    <input type="number" id="puntaje2" name="puntaje2" class="form-control" min="1" max="10" step="0.5" required>
                </div>

                <!-- Campo para el Puntaje 3 -->
                <div class="form-group">
                    <label for="puntaje3">Puntaje 3 (Ej: Cultura General)</label>
                    <input type="number" id="puntaje3" name="puntaje3" class="form-control" min="1" max="10" step="0.5" required>
                </div>

                <button type="submit" class="btn-primary">Registrar Voto</button>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmación -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <p id="modalText"></p>
            <div class="modal-actions">
                <button id="confirmBtn" class="confirm-btn">Sí, confirmar</button>
                <button id="cancelBtn" class="cancel-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const votingForm = document.getElementById('voting-form');
        const modal = document.getElementById('confirmModal');
        const modalText = document.getElementById('modalText');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // El script se actualiza para manejar los 3 puntajes
        votingForm.addEventListener('submit', function(event) {
            event.preventDefault(); 
            const p1 = document.getElementById('puntaje1').value;
            const p2 = document.getElementById('puntaje2').value;
            const p3 = document.getElementById('puntaje3').value;
            const nombreCandidata = document.querySelector('.main-title').innerText.replace('Votando por ', '');
            
            modalText.innerText = `¿Confirmas los puntajes ${p1}, ${p2} y ${p3} para la candidata ${nombreCandidata}?`;
            modal.style.display = 'flex';
        });

        confirmBtn.addEventListener('click', function() {
            modal.style.display = 'none';
            votingForm.submit(); 
        });

        cancelBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
    </script>
</body>
</html>
