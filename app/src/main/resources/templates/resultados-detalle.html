<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Votos - FNE</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
     <link rel="stylesheet" th:href="@{/css/resultados-detalle.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <a th:href="@{/resultados}" class="back-link">&larr; Volver a Resultados</a>
        <h1 class="main-title" th:text="'Detalle de Votos para ' + ${candidata.nombres} + ' ' + ${candidata.apellidos}">Detalle de Votos</h1>
        
        <div class="table-container">
            <table th:if="${!votos.isEmpty()}">
                <thead>
                    <tr>
                        <th>Jurado</th>
                        <th>Puntaje 1</th>
                        <th>Puntaje 2</th>
                        <th>Puntaje 3</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- La tabla ahora muestra los 3 puntajes y el subtotal -->
                    <tr th:each="voto : ${votos}">
                        <td th:text="${voto.jurado.nombre}">Nombre del Jurado</td>
                        <td th:text="${#numbers.formatDecimal(voto.puntaje1, 1, 1)}">0.0</td>
                        <td th:text="${#numbers.formatDecimal(voto.puntaje2, 1, 1)}">0.0</td>
                        <td th:text="${#numbers.formatDecimal(voto.puntaje3, 1, 1)}">0.0</td>
                        <td class="subtotal" th:text="${#numbers.formatDecimal(voto.subtotal, 1, 2)}">0.00</td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${votos.isEmpty()}">No hay votos registrados para esta candidata.</p>
        </div>
    </div>
</body>
</html>
