<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Candidata</title>
     <link rel="stylesheet" th:href="@{/css/resultados-detalle.css}">
     
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div class="back-btn-container">
            <a th:href="@{/resultados}" class="back-btn">
            
               < Volver a Resultados
            </a>
        </div>
        
        <div class="details-card">
            <img class="candidate-photo" th:src="@{'/img/candidatas/' + ${candidata.id} + '.webp'}" alt="Foto de la candidata" />
            <div class="candidate-info-text">
                <h1 th:text="${candidata.nombres} + ' ' + ${candidata.apellidos}"></h1>
                <p >Representante de:</p>
                <p th:text="${candidata.colegioSecundario}"></p>
                <div class="total-score-box">
                    <span class="total-score-label">Puntaje Total:</span>
                    <span th:text="${#numbers.formatDecimal(candidata.puntajeTotal, 0, 2)}" class="total-score-value"></span>
                </div>
            </div>
        </div>

        <div class="judges-scores-container">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Puntajes de Jueces</h2>
            <div th:if="${votos.empty}" class="no-votes">
                <p>Aún no hay votos registrados para esta candidata.</p>
            </div>
            <table th:if="${not votos.empty}" class="judges-scores-table">
                <thead>
                    <tr>
                        <th>Juez</th>
                        <th>Puntaje</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="voto : ${votos}">
                        <td th:text="${voto.jurado.nombre}"></td>
                        <td th:text="${#numbers.formatDecimal(voto.puntaje, 0, 2)}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
